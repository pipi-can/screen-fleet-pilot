<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <!-- 背景圆角方形 -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bg)" stroke="#334155" stroke-width="2"/>

  <!-- 顶部信号波纹（远程管控） -->
  <g transform="translate(256,140)" opacity="0.7">
    <path d="M-30,-8 Q0,-30 30,-8" fill="none" stroke="#06b6d4" stroke-width="4" stroke-linecap="round"/>
    <path d="M-18,-16 Q0,-36 18,-16" fill="none" stroke="#06b6d4" stroke-width="4" stroke-linecap="round"/>
    <path d="M-6,-24 Q0,-42 6,-24" fill="none" stroke="#06b6d4" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- 显示器 -->
  <g transform="translate(256,240)">
    <!-- 屏幕外框 -->
    <rect x="-160" y="-90" width="320" height="200" rx="24" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <!-- 屏幕内框 -->
    <rect x="-148" y="-78" width="296" height="172" rx="16" fill="#1e293b"/>
    <!-- 网格 -->
    <g stroke="#334155" stroke-width="1.5" opacity="0.5">
      <line x1="-100" y1="-50" x2="-100" y2="70"/>
      <line x1="-20" y1="-50" x2="-20" y2="70"/>
      <line x1="60" y1="-50" x2="60" y2="70"/>
      <line x1="-148" y1="0" x2="148" y2="0"/>
      <line x1="-148" y1="35" x2="148" y2="35"/>
    </g>
    <!-- 设备节点 -->
    <circle cx="-100" cy="-50" r="7" fill="url(#accent)"/>
    <circle cx="-20" cy="0" r="7" fill="url(#accent)"/>
    <circle cx="60" cy="35" r="7" fill="url(#accent)"/>
    <circle cx="-100" cy="35" r="7" fill="url(#accent)" opacity="0.35"/>
    <circle cx="60" cy="-50" r="7" fill="url(#accent)" opacity="0.35"/>
    <circle cx="-20" cy="-50" r="7" fill="url(#accent)" opacity="0.35"/>
    <!-- 连线 -->
    <line x1="-100" y1="-50" x2="-20" y2="0" stroke="#06b6d4" stroke-width="2" opacity="0.4"/>
    <line x1="-20" y1="0" x2="60" y2="35" stroke="#06b6d4" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- 底部文字 -->
  <text x="256" y="390" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="700" fill="#e2e8f0" letter-spacing="4">SCREEN</text>
  <text x="256" y="440" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="400" fill="#64748b" letter-spacing="12">FLEET PILOT</text>
</svg>
